name: App Android

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'KillaUru-main/app/**'
      - 'KillaUru-main/specs/**/contracts/**'
      - '.github/workflows/app-ci.yml'
  push:
    branches: ["**"]
    paths:
      - 'KillaUru-main/app/**'
      - 'KillaUru-main/specs/**/contracts/**'
      - '.github/workflows/app-ci.yml'

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: KillaUru-main/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compilar APK
        run: bash gradlew assembleDebug
      - name: Lint y reglas de diseÃ±o
        run: bash gradlew lint detekt
      - name: Pruebas y cobertura del dominio
        run: bash gradlew testDebugUnitTest koverVerify koverXmlReport
      - name: LÃ­mite constitucional de archivos
        run: |
          python -m unittest discover -s herramientas -p 'test_*.py'
          python herramientas/verificar_lineas.py
      - name: Evidencia de verificaciÃ³n
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-verificacion
          path: |
            KillaUru-main/app/build/reports/
            KillaUru-main/app/build/test-results/
