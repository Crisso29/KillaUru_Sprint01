name: Panel Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'panel/**'

defaults:
  run:
    working-directory: panel

jobs:
  deploy:
    name: Deploy a Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - run: npm ci

      - name: Build producción
        run: npm run build
        env:
          VITE_URL_API: ${{ vars.VITE_URL_API }}
          VITE_URL_ESTILO_MAPA: ${{ vars.VITE_URL_ESTILO_MAPA }}
          VITE_URL_PMTILES: ${{ vars.VITE_URL_PMTILES }}
          VITE_URL_ESTADO: ${{ vars.VITE_URL_ESTADO }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}

      - name: Deploy a Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name killauru-panel --branch main
          workingDirectory: panel

      - name: Verificar cabeceras de seguridad
        run: node scripts/verificar-cabeceras.mjs
        env:
          PANEL_URL: https://panel.killauru.pe
