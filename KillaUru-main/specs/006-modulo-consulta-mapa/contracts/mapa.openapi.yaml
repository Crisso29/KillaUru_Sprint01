openapi: 3.1.0
info:
  title: KillaUru API — Consulta de Mapa
  version: 1.0.0
  description: |
    Mapa de anomalías en GeoJSON con alcance por rol (RF-14, RF-17, RN-08) y caché por celdas (ADR-006).
    El recorte lo hace siempre el servidor (RNF-27).
servers:
  - url: https://api.killauru.pe
tags:
  - { name: Mapa, description: Anomalías visibles según el rol }

paths:
  /api/v1/anomalies:
    get:
      tags: [Mapa]
      operationId: consultarMapa
      summary: Anomalías del mapa según el rol
      description: |
        Rol: público (anónimo, conductor registrado o administrador). Límite: política `consultas` (RNF-11).
        Anónimo → solo `Activa` dentro del tramo demo Ayacucho–Vinchos, aunque pida un `bbox` mayor.
        Conductor → solo `Activa` en el corredor. Administrador → los estados pedidos (por defecto `Activa` y `PendienteConfirmacion`).
        Sin filtros, anónimos y conductores reciben `ETag` y pueden revalidar con `If-None-Match` (304).
        Con `updatedSince`, las anomalías que dejaron de ser visibles llegan como `{id, eliminada: true}`.
        Solo las respuestas sin token son `public, max-age=60`; con token, `private, no-store` (ADR-006).
      security: [ {}, { tokenAcceso: [] }, { cookieAcceso: [] } ]
      parameters:
        - { $ref: '#/components/parameters/Seudonimo' }
        - name: bbox
          in: query
          description: '`minLon,minLat,maxLon,maxLat`. Sin `bbox` = todo el alcance del rol.'
          schema: { type: string, example: '-74.35,-13.25,-74.20,-13.10' }
        - { name: tipo, in: query, schema: { $ref: '#/components/schemas/TipoAnomalia' } }
        - name: severidad
          in: query
          description: Lista separada por comas (severidad mostrada).
          schema: { type: string, example: '4,5' }
        - { name: desde, in: query, description: Sobre la última detección, schema: { type: string, format: date-time } }
        - { name: hasta, in: query, schema: { type: string, format: date-time } }
        - name: estado
          in: query
          description: Solo administrador (otro rol → 403). Lista separada por comas.
          schema: { type: string, example: 'Activa,PendienteConfirmacion' }
        - name: updatedSince
          in: query
          description: Cambios desde esa hora (usar el `generadoUtc` de la respuesta anterior). No se combina con filtros.
          schema: { type: string, format: date-time }
        - { name: If-None-Match, in: header, schema: { type: string } }
      responses:
        '200':
          description: Anomalías visibles para el rol
          headers:
            ETag: { description: Solo sin filtros ni `updatedSince`, schema: { type: string } }
            Cache-Control: { description: '`public, max-age=60` sin token; `private, no-store` con token', schema: { type: string } }
          content:
            application/geo+json:
              schema: { $ref: '#/components/schemas/ColeccionAnomalias' }
        '304':
          description: Ninguna celda pedida cambió desde el `ETag` enviado
          headers:
            ETag: { schema: { type: string } }
        '400':
          description: '`bbox`, fechas o filtros inválidos (`datos_invalidos`), o `updatedSince` con filtros (`parametros_incompatibles`)'
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }

components:
  securitySchemes:
    tokenAcceso: { $ref: '../../001-plataforma-backend/contracts/plataforma.openapi.yaml#/components/securitySchemes/tokenAcceso' }
    cookieAcceso: { $ref: '../../001-plataforma-backend/contracts/plataforma.openapi.yaml#/components/securitySchemes/cookieAcceso' }
  parameters:
    Seudonimo: { $ref: '../../001-plataforma-backend/contracts/plataforma.openapi.yaml#/components/parameters/Seudonimo' }
  responses:
    NoAutenticado: { $ref: '../../001-plataforma-backend/contracts/plataforma.openapi.yaml#/components/responses/NoAutenticado' }
    Prohibido: { $ref: '../../001-plataforma-backend/contracts/plataforma.openapi.yaml#/components/responses/Prohibido' }
    LimiteExcedido: { $ref: '../../001-plataforma-backend/contracts/plataforma.openapi.yaml#/components/responses/LimiteExcedido' }
  schemas:
    Problema: { $ref: '../../001-plataforma-backend/contracts/plataforma.openapi.yaml#/components/schemas/Problema' }
    TipoAnomalia: { type: string, enum: [Bache, Hundimiento] }
    EstadoAnomalia: { type: string, enum: [Activa, PendienteConfirmacion, Expirada, Reparada, Descartada] }
    ColeccionAnomalias:
      type: object
      required: [type, generadoUtc, features]
      properties:
        type: { const: FeatureCollection }
        generadoUtc: { type: string, format: date-time, description: Hora del servidor; próximo `updatedSince` }
        features:
          type: array
          items: { oneOf: [ { $ref: '#/components/schemas/AnomaliaFeature' }, { $ref: '#/components/schemas/BajaFeature' } ] }
    AnomaliaFeature:
      type: object
      required: [type, id, geometry, properties]
      properties:
        type: { const: Feature }
        id: { type: string, format: uuid }
        geometry:
          type: object
          required: [type, coordinates]
          properties:
            type: { const: Point }
            coordinates: { type: array, minItems: 2, maxItems: 2, items: { type: number }, description: '[longitud, latitud]' }
        properties:
          type: object
          required: [id, tipo, severidad, persistencia, ultimaDeteccionUtc, venceUtc]
          properties:
            id: { type: string, format: uuid }
            tipo: { $ref: '#/components/schemas/TipoAnomalia' }
            severidad: { type: integer, minimum: 1, maximum: 5 }
            persistencia: { type: string, enum: [Episodica, Persistente] }
            ultimaDeteccionUtc: { type: string, format: date-time }
            venceUtc: { type: string, format: date-time }
            estado: { $ref: '#/components/schemas/EstadoAnomalia', description: Solo para el administrador }
    BajaFeature:
      type: object
      description: Anomalía que dejó de ser visible para el rol desde `updatedSince` (RF-14). No revela su estado.
      required: [type, id, geometry, properties]
      properties:
        type: { const: Feature }
        id: { type: string, format: uuid }
        geometry: { type: 'null' }
        properties:
          type: object
          required: [id, eliminada]
          properties:
            id: { type: string, format: uuid }
            eliminada: { const: true }
