[versions]
agp = "9.3.3"
kotlin = "2.4.20"
ksp = "2.3.13"
compose = "2025.05.01"
room = "2.8.4"
hilt = "2.60.1"
work = "2.10.2"
coroutines = "1.10.2"
serialization = "1.8.1"
okhttp = "4.12.0"
retrofit = "2.11.0"
kover = "0.9.11"
detekt = "2.0.0-alpha.6"

[plugins]
android = { id = "com.android.application", version.ref = "agp" }
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
room = { id = "androidx.room", version.ref = "room" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
detekt = { id = "dev.detekt", version.ref = "detekt" }

[libraries]
core = { module = "androidx.core:core-ktx", version = "1.16.0" }
activity = { module = "androidx.activity:activity-compose", version = "1.10.1" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-material = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-test = { module = "androidx.compose.ui:ui-test-junit4" }
compose-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
navigation = { module = "androidx.navigation:navigation-compose", version = "2.9.0" }
lifecycle = { module = "androidx.lifecycle:lifecycle-runtime-compose", version = "2.9.1" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
work-testing = { module = "androidx.work:work-testing", version.ref = "work" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-work = { module = "androidx.hilt:hilt-work", version = "1.2.0" }
hilt-work-compiler = { module = "androidx.hilt:hilt-compiler", version = "1.2.0" }
datastore = { module = "androidx.datastore:datastore-preferences", version = "1.1.7" }
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
litert = { module = "com.google.ai.edge.litert:litert", version = "1.4.0" }
maplibre = { module = "org.maplibre.gl:android-sdk", version = "11.13.0" }
junit = { module = "junit:junit", version = "4.13.2" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
robolectric = { module = "org.robolectric:robolectric", version = "4.14.1" }
android-test = { module = "androidx.test:core-ktx", version = "1.6.1" }
android-runner = { module = "androidx.test:runner", version = "1.6.2" }
konsist = { module = "com.lemonappdev:konsist", version = "0.17.3" }
swagger = { module = "io.swagger.parser.v3:swagger-parser", version = "2.1.27" }
json-schema = { module = "com.networknt:json-schema-validator", version = "1.5.6" }
