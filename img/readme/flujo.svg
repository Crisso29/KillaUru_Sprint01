<svg xmlns="http://www.w3.org/2000/svg" width="987" height="233" viewBox="0 0 987 233" role="img" aria-label="Flujo de KillaUru: sensores, IA en el celular, guardado sin señal, sincronización, confirmación colectiva y mapa">
  <defs>
    <style>
      .t{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}
      .n{font-size:13px;fill:#8f9bd6;letter-spacing:2px}
      .h{font-size:21px;font-weight:700;fill:#fff}
      .s{font-size:13px;fill:#c9d3ff}
      .flow{stroke-dasharray:8 13;animation:f 1.6s linear infinite}
      @keyframes f{to{stroke-dashoffset:-21}}
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1026"/><stop offset="1" stop-color="#241b45"/></linearGradient>
  </defs>
  <rect width="987" height="233" rx="21" fill="url(#bg)"/>
  <g class="t">
    <g transform="translate(21,34)">
      <rect width="144" height="144" rx="13" fill="#1b2350" stroke="#3a4592"/>
      <text x="13" y="34" class="n">01</text><text x="13" y="76" class="h">Sensores</text>
      <text x="13" y="102" class="s">Acelerómetro,</text><text x="13" y="120" class="s">giroscopio, GPS</text>
    </g>
    <g transform="translate(186,34)">
      <rect width="144" height="144" rx="13" fill="#1b2350" stroke="#3a4592"/>
      <text x="13" y="34" class="n">02</text><text x="13" y="76" class="h">Edge AI</text>
      <text x="13" y="102" class="s">Clasifica en el</text><text x="13" y="120" class="s">celular, &lt; 50 ms</text>
    </g>
    <g transform="translate(351,34)">
      <rect width="144" height="144" rx="13" fill="#1b2350" stroke="#3a4592"/>
      <text x="13" y="34" class="n">03</text><text x="13" y="76" class="h">Sin señal</text>
      <text x="13" y="102" class="s">Guarda en SQLite</text><text x="13" y="120" class="s">y espera</text>
    </g>
    <g transform="translate(516,34)">
      <rect width="144" height="144" rx="13" fill="#1b2350" stroke="#3a4592"/>
      <text x="13" y="34" class="n">04</text><text x="13" y="76" class="h">Sincroniza</text>
      <text x="13" y="102" class="s">Lotes idempotentes</text><text x="13" y="120" class="s">al volver la señal</text>
    </g>
    <g transform="translate(681,34)">
      <rect width="144" height="144" rx="13" fill="#1b2350" stroke="#3a4592"/>
      <text x="13" y="34" class="n">05</text><text x="13" y="76" class="h">Confirma</text>
      <text x="13" y="102" class="s">Con reportes de</text><text x="13" y="120" class="s">2 vehículos</text>
    </g>
    <g transform="translate(846,34)">
      <rect width="120" height="144" rx="13" fill="#3b2a5c" stroke="#ffd166"/>
      <text x="13" y="34" class="n" style="fill:#ffd166">06</text><text x="13" y="76" class="h">Mapa</text>
      <text x="13" y="102" class="s">Alerta al</text><text x="13" y="120" class="s">siguiente</text>
    </g>
    <path class="flow" d="M165 106 H186 M330 106 H351 M495 106 H516 M660 106 H681 M825 106 H846" stroke="#ffd166" stroke-width="3"/>
    <text x="21" y="212" class="s" style="fill:#8f9bd6">Sin botones · sin reportes manuales · el servidor nunca recibe la señal cruda de los sensores</text>
  </g>
</svg>
